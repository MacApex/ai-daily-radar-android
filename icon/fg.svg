<svg xmlns='http://www.w3.org/2000/svg' width='108' height='108' viewBox='0 0 108 108'>
  <defs>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EEAD4" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A99CFF"/><stop offset="1" stop-color="#6B55F0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.1" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g transform="translate(54 54)">
    <!-- sweep wedge -->
    <path d="M0 0 L0 -30 A30 30 0 0 1 25.98 -15 Z" fill="url(#sweep)" opacity="0.55"/>
    <!-- rings -->
    <circle r="30" fill="none" stroke="url(#ring)" stroke-width="2.6"/>
    <circle r="20" fill="none" stroke="#8B7BFF" stroke-opacity="0.6" stroke-width="1.6"/>
    <circle r="10" fill="none" stroke="#8B7BFF" stroke-opacity="0.45" stroke-width="1.3"/>
    <!-- sweep arm -->
    <line x1="0" y1="0" x2="0" y2="-30" stroke="#5EEAD4" stroke-width="2.2" stroke-linecap="round"/>
    <!-- constellation -->
    <g stroke="#5EEAD4" stroke-opacity="0.8" stroke-width="1.3" stroke-linecap="round" fill="none">
      <polyline points="9,-21 17,-9 12,4 22,12"/>
      <line x1="17" y1="-9" x2="-13" y2="9"/>
      <line x1="-13" y1="9" x2="-6" y2="20"/>
    </g>
    <g filter="url(#glow)">
      <circle cx="9" cy="-21" r="2.4" fill="#E9FFFB"/>
      <circle cx="17" cy="-9" r="3.2" fill="#5EEAD4"/>
      <circle cx="12" cy="4" r="2.2" fill="#C9C1FF"/>
      <circle cx="22" cy="12" r="2.6" fill="#8B7BFF"/>
      <circle cx="-13" cy="9" r="2.8" fill="#5EEAD4"/>
      <circle cx="-6" cy="20" r="2" fill="#C9C1FF"/>
      <circle cx="0" cy="0" r="3.4" fill="#FFFFFF"/>
    </g>
  </g></svg>
